[package]
name = "kwiry-vector-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: vector-index candidates stay out of the daemon
# workspace until Vertical 3 picks a winner.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8"
