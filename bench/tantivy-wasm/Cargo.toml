[package]
name = "kwiry-tantivy-wasm-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

# Standalone workspace: this probe must not alter the daemon workspace or its
# lockfile before Tantivy's ordinary WASM lifecycle has a verdict.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "=0.26.1", default-features = false }
uuid = { version = "=1.24.0", features = ["js"] }
wasm-bindgen = "=0.2.126"
