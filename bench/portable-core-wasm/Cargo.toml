[package]
name = "kwiry-portable-core-wasm-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

# Standalone workspace: the parity witness must build kwiry-core through its
# public portable feature without changing the daemon workspace or lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kwiry-portable-core-native"
path = "src/bin/native.rs"

[dependencies]
kwiry-core = { path = "../../daemon/crates/kwiry-core", default-features = false, features = ["portable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
