name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: Daemon (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Format
        run: cargo fmt --all --check
        working-directory: daemon
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: daemon
      - name: Tests
        run: cargo test --workspace
        working-directory: daemon

  daemon-windows:
    name: Daemon Windows (fmt, clippy, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features

  portable-core:
    name: Portable core (native and WASM parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon
            bench/portable-core-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Format standalone adapter
        run: cargo fmt --manifest-path bench/portable-core-wasm/Cargo.toml --all -- --check
      - name: Check and test portable-only core
        run: |
          cargo clippy --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable --all-targets -- -D warnings
          cargo test --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable
          cargo check --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable --target wasm32-unknown-unknown
      - name: Compare native and Node-loaded WASM output
        run: npm test --prefix bench/portable-core-wasm

  rebuild-determinism:
    name: Rebuild-from-nothing determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Build
        run: cargo build -p kwiry
        working-directory: daemon
      - name: Index, record, destroy, rebuild, compare
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bin="$PWD/daemon/target/debug/kwiry"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" vault add --id fixture --path "$PWD/fixtures/vault"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" index
          for q in phosphorescent welcome "vocabulary mismatch"; do
            "$bin" --config "$work/config.toml" --data-dir "$work/data" search "$q" --json >> "$work/first.json"
          done
          rm -rf "$work/data"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" index
          for q in phosphorescent welcome "vocabulary mismatch"; do
            "$bin" --config "$work/config.toml" --data-dir "$work/data" search "$q" --json >> "$work/second.json"
          done
          cmp "$work/first.json" "$work/second.json"
          echo "lexical results identical across rebuild-from-nothing"

  obsidian-plugin:
    name: Obsidian plugin Gate 5 lifecycle (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: clients/obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/obsidian/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/obsidian/rust/kwiry-obsidian-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install
        run: npm ci
      - name: Verify production Rust adapter
        run: |
          cargo fmt --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml
          cargo check --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --target wasm32-unknown-unknown
          npm test --prefix rust/kwiry-obsidian-wasm
      - name: Lifecycle, protocol, and exact-Worker tests
        run: npm test
      - name: Moderate deterministic corpus smoke
        run: npm run corpus:smoke
      - name: Build two-WASM one-file artifact
        run: npm run build
      - name: Verify disposable functional vault package
        run: npm run test-vault:smoke
      - name: Generate deterministic Gate 5 evidence
        run: npm run --silent evidence > gate5.evidence.json
      - name: Verify artifact policy, evidence privacy, versions, and notices
        run: |
          test -f main.js && test -f manifest.json && test -f styles.css
          test -f THIRD_PARTY_NOTICES.md && test -f licenses/Apache-2.0.txt
          head -20 main.js | grep -q "GNU General Public License"
          node -e "const m=require('./manifest.json'),p=require('./package.json'); if(m.version!==p.version){console.error('manifest/package version mismatch');process.exit(1)}"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync("gate5.evidence.json", "utf8"));
            if (evidence.verdict !== "AUTOMATED_CHECKS_PASSED_OWNER_REVIEW_REQUIRED") process.exit(1);
            if (evidence.checks.failed !== 0 || evidence.artifact.wasm_inputs !== 2) process.exit(1);
            if (evidence.artifact.loose_runtime_assets !== 0) process.exit(1);
            if (evidence.corpus.kind !== "generated_functional" || evidence.targets.length !== 7) process.exit(1);
            if (!evidence.privacy.aggregate_only || evidence.privacy.paths_emitted !== 0) process.exit(1);
          '
          test "$(find . -maxdepth 1 -type f \( -name '*.wasm' -o -name '*worker*.js' -o -name '*.map' -o -name '*.db' -o -name '*.sqlite' \) | wc -l)" -eq 0
      - name: Scan first-party source and artifact
        run: |
          set -euo pipefail
          ! rg -n -i '(/home/(?!web_user(?:/|"))[A-Za-z0-9._-]+/|/mnt/[a-z]/[Uu]sers/|[A-Z]:\\Users\\|api[_-]?key\s*[:=]|secret\s*[:=]|bearer\s+[A-Za-z0-9._~+/-]{12,})' \
            src test esbuild.config.mjs main.js \
            --pcre2 --glob '!package-lock.json'
          ! rg -n '(requestUrl|readDaemonToken|Authorization|tokenProvider)' src/worker
      - name: Prepare exact Gate 5 field package
        if: matrix.node == 22
        run: |
          set -euo pipefail
          package=.tmp/gate5-field-package
          rm -rf "$package"
          mkdir -p "$package"
          cp main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md gate5.evidence.json "$package/"
          (cd "$package" && sha256sum LICENSE THIRD_PARTY_NOTICES.md gate5.evidence.json main.js manifest.json styles.css > SHA256SUMS)
          test "$(find "$package" -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find "$package" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
      - name: Upload sanitized Gate 5 evidence and field package
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: kwiry-gate5-field-package
          path: clients/obsidian/.tmp/gate5-field-package/
          retention-days: 7
          if-no-files-found: error

  obsidian-fts5-gate2:
    name: Obsidian FTS5 Gate 2 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            bench/fts5-wasm/package-lock.json
            bench/fts5-wasm-obsidian-probe/package-lock.json
      - name: Verify Gate 1 baseline
        run: |
          npm ci --prefix bench/fts5-wasm
          npm test --prefix bench/fts5-wasm
          npm run evidence --prefix bench/fts5-wasm
      - name: Install Gate 2 probe
        run: npm ci --prefix bench/fts5-wasm-obsidian-probe
      - name: Typecheck Gate 2 probe
        run: npm run typecheck --prefix bench/fts5-wasm-obsidian-probe
      - name: Test Gate 2 protocol, artifact, and runtime
        run: npm test --prefix bench/fts5-wasm-obsidian-probe
      - name: Build one-file sideload artifact
        run: npm run build --prefix bench/fts5-wasm-obsidian-probe
      - name: Generate and validate sanitized evidence
        working-directory: bench/fts5-wasm-obsidian-probe
        run: |
          node scripts/evidence.mjs > gate2.evidence.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync("gate2.evidence.json", "utf8"));
            if (evidence.verdict !== "READY_FOR_FIELD_TEST") process.exit(1);
            if (evidence.tests.failed !== 0 || evidence.bundle.loose_runtime_assets !== 0) process.exit(1);
            if (evidence.tests.network_attempts !== 0 || evidence.tests.persistence_attempts !== 0) process.exit(1);
          '
      - name: Scan first-party source and artifacts
        run: |
          set -euo pipefail
          ! rg -n -i '(/home/|/mnt/c/|[A-Z]:\\Users\\|api[_-]?key\s*[:=]|secret\s*[:=]|bearer\s+[A-Za-z0-9._~+/-]{12,})' \
            bench/fts5-wasm-obsidian-probe \
            --glob '!node_modules/**' --glob '!package-lock.json' --glob '!main.js'
          ! rg -n -i '(https?://(cdn\.|unpkg\.|cdn\.jsdelivr\.)|requestUrl|app\.vault|loadData\(|saveData\(|node:fs)' \
            bench/fts5-wasm-obsidian-probe/src
          test "$(find bench/fts5-wasm-obsidian-probe -maxdepth 1 -type f \
            \( -name '*.wasm' -o -name '*worker*.js' -o -name '*.map' -o -name '*.db' -o -name '*.sqlite' \) | wc -l)" -eq 0
      - name: Prepare short-retention field-test artifact
        if: matrix.node == 22
        working-directory: bench/fts5-wasm-obsidian-probe
        run: |
          mkdir -p .tmp/sideload
          cp main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md .tmp/sideload/
          sha256sum .tmp/sideload/* > .tmp/sideload/SHA256SUMS
      - name: Upload sanitized evidence and sideload package
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: kwiry-fts5-gate2-field-test
          path: |
            bench/fts5-wasm-obsidian-probe/gate2.evidence.json
            bench/fts5-wasm-obsidian-probe/.tmp/sideload/
          retention-days: 7
          if-no-files-found: error
