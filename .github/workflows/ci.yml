name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: Daemon (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      - name: Local daemon quality gate
        run: make check COMPONENT=daemon
      - name: Verify r10 FR9–FR12 in the core API
        if: ${{ !cancelled() }}
        working-directory: daemon
        run: |
          status=0
          for vector in fr9_ fr10_ fr11_ fr12_; do
            cargo test --locked -p kwiry-core --lib "$vector" || status=1
          done
          exit "$status"
      - name: Test all workspace features (component harnesses force Holdings on)
        working-directory: daemon
        run: cargo test --locked --workspace --all-features
      - name: Verify N30, N31, FR1–FR3, FR7, FR11 and FR12 against the release binary
        if: ${{ !cancelled() }}
        working-directory: daemon
        env:
          KWIRY_FR1_STRACE: "1"
        run: |
          command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
          cargo test --release --locked -p kwiry --test daemon format_release_

  daemon-openclast-platform:
    name: OpenClast platform refusal (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      - name: Verify N33 on a non-Linux target
        run: cargo test --locked -p kwiry --no-default-features --test daemon n33_non_linux_rejects_openclast_before_data_root_but_serves_desktop

  daemon-room-rollback:
    name: Room identity rollback (4ba5ba94)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4ba5ba943d1f15e61b7dce5a2f72fcb73301d352
          path: rollback-base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            rollback-base/daemon
      - name: Build pre-spec binary
        run: cargo build --locked --manifest-path rollback-base/daemon/Cargo.toml -p kwiry
      - name: Exercise RB1 and RB2 against the pre-spec binary
        working-directory: daemon
        env:
          KWIRY_ROLLBACK_BINARY: ${{ github.workspace }}/rollback-base/daemon/target/debug/kwiry
        run: cargo test --locked -p kwiry --test room_rollback

      - name: Exercise N24 and FR4 in a private Linux mount namespace
        working-directory: daemon
        run: |
          test_bin=$(cargo test --locked -p kwiry-core --lib --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "kwiry_core") | .executable')
          parent_ns=$(readlink /proc/self/ns/mnt)
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          chmod 755 "$scratch"
          install -m 755 "$test_bin" "$scratch/n24"
          sudo unshare -rm env KWIRY_N24_PARENT_NS="$parent_ns" "$scratch/n24" --ignored --exact room_walk::tests::room_walk_n24_does_not_cross_a_bind_mount

      - name: Exercise N26 with the actual build constant off
        working-directory: daemon
        run: |
          sed -i 's/pub const ROOM_INCLUSIVE_IDS: bool = true;/pub const ROOM_INCLUSIVE_IDS: bool = false;/' crates/kwiry-core/src/source.rs
          cargo test --locked -p kwiry-core --lib multi_room_registration_vectors_n19_n21_n26_n27_n29

  daemon-windows:
    name: Daemon Windows (fmt, clippy, tests)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-features

  portable-core:
    name: Portable core (native and WASM parity)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            bench/portable-core-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Format standalone adapter
        run: cargo fmt --manifest-path bench/portable-core-wasm/Cargo.toml --all -- --check
      - name: Clippy standalone adapter
        run: cargo clippy --locked --manifest-path bench/portable-core-wasm/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Check and test portable-only core
        run: |
          cargo clippy --locked --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable --all-targets -- -D warnings
          cargo test --locked --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable
          cargo check --locked --manifest-path daemon/Cargo.toml -p kwiry-core --no-default-features --features portable --target wasm32-unknown-unknown
      - name: Compare native and Node-loaded WASM output
        run: npm test --prefix bench/portable-core-wasm

  rebuild-determinism:
    name: Rebuild-from-nothing determinism
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      - name: Build
        run: cargo build --locked -p kwiry
        working-directory: daemon
      - name: Index, record, destroy, rebuild, compare
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          bin="$PWD/daemon/target/debug/kwiry"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" vault add --id fixture --path "$PWD/fixtures/vault"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" index
          for q in phosphorescent welcome "vocabulary mismatch"; do
            "$bin" --config "$work/config.toml" --data-dir "$work/data" search "$q" --json >> "$work/first.json"
          done
          rm -rf "$work/data"
          "$bin" --config "$work/config.toml" --data-dir "$work/data" index
          for q in phosphorescent welcome "vocabulary mismatch"; do
            "$bin" --config "$work/config.toml" --data-dir "$work/data" search "$q" --json >> "$work/second.json"
          done
          cmp "$work/first.json" "$work/second.json"
          echo "lexical results identical across rebuild-from-nothing"

  obsidian-plugin:
    name: Obsidian plugin Gate 5 lifecycle (Node ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { major: "22", node: "22.23.1" }
          - { major: "24", node: "24.22.3" }
    defaults:
      run:
        working-directory: clients/obsidian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/obsidian/package-lock.json
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # v1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clients/obsidian/rust/kwiry-obsidian-wasm
          # Shared with publish-plugin-release.yml so a tag dispatch can
          # restore the warm cache this job saves; rust-cache's default key
          # embeds the job name, which no other job can match.
          shared-key: obsidian-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install
        run: npm ci
      - name: Verify production Rust adapter
        run: |
          cargo fmt --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml
          cargo check --locked --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --target wasm32-unknown-unknown
          npm test --prefix rust/kwiry-obsidian-wasm
      - name: Local plugin quality gate (lint, typecheck, tests, versions)
        run: make -C ../.. check COMPONENT=obsidian
        env:
          NODE_OPTIONS: --max-old-space-size=1536
      - name: Moderate deterministic corpus smoke
        run: npm run corpus:smoke
      - name: Build two-WASM one-file artifact
        run: npm run build
      - name: Verify disposable functional vault package
        run: npm run test-vault:smoke
      - name: Generate deterministic Gate 5 evidence
        run: npm run --silent evidence > gate5.evidence.json
      - name: Verify artifact policy, evidence privacy, versions, and notices
        run: |
          set -euo pipefail
          npm run validate:evidence -- gate5.evidence.json
          npm run validate:release:source -- gate5.evidence.json
          # Publication requires this workflow green at the tag, so running the
          # licence gate here is what makes it a required check. It previously
          # ran only in validate-d5c-brat.yml, which is how the DOCX and PDF
          # waves grew the dependency graph past its notices unnoticed.
          npm run verify:d5c:licenses
          npm run verify:docx:licenses
          # The two lines above only prove the graph matches the inventory and
          # the bundle matches its own digest. That digest is self-referential:
          # it is sha256 of the body in the bundle, not of the crate's upstream
          # file, which is how rawzip's licence shipped under the quick-xml
          # heading. This third gate compares each pinned body against the
          # crate's own vendored licence file, and fails closed when a crate or
          # its licence file is absent rather than skipping it.
          npm run verify:mit:notices
          test "$(find . -maxdepth 1 -type f \( -name '*.wasm' -o -name '*worker*.js' -o -name '*.map' -o -name '*.db' -o -name '*.sqlite' \) | wc -l)" -eq 0
      - name: Validate first-party privacy and Worker authority
        run: npm run validate:privacy
      - name: Prepare exact Gate 5 field package
        if: matrix.node == '22.23.1'
        run: npm run package:release -- .tmp/gate5-field-package gate5.evidence.json
      - name: Upload sanitized Gate 5 evidence and field package
        if: matrix.node == '22.23.1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kwiry-gate5-field-package
          path: clients/obsidian/.tmp/gate5-field-package/
          retention-days: 7
          if-no-files-found: error

  obsidian-fts5-gate2:
    name: Obsidian FTS5 Gate 2 (Node ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { major: "22", node: "22.23.1" }
          - { major: "24", node: "24.22.3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            bench/fts5-wasm/package-lock.json
            bench/fts5-wasm-obsidian-probe/package-lock.json
      - name: Verify Gate 1 baseline
        run: |
          npm ci --prefix bench/fts5-wasm
          npm test --prefix bench/fts5-wasm
          npm run evidence --prefix bench/fts5-wasm
      - name: Install Gate 2 probe
        run: npm ci --prefix bench/fts5-wasm-obsidian-probe
      - name: Typecheck Gate 2 probe
        run: npm run typecheck --prefix bench/fts5-wasm-obsidian-probe
      - name: Test Gate 2 protocol, artifact, and runtime
        run: npm test --prefix bench/fts5-wasm-obsidian-probe
      - name: Build one-file sideload artifact
        run: npm run build --prefix bench/fts5-wasm-obsidian-probe
      - name: Generate and validate sanitized evidence
        working-directory: bench/fts5-wasm-obsidian-probe
        run: |
          node scripts/evidence.mjs > gate2.evidence.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync("gate2.evidence.json", "utf8"));
            if (evidence.verdict !== "READY_FOR_FIELD_TEST") process.exit(1);
            if (evidence.tests.failed !== 0 || evidence.bundle.loose_runtime_assets !== 0) process.exit(1);
            if (evidence.tests.network_attempts !== 0 || evidence.tests.persistence_attempts !== 0) process.exit(1);
          '
      - name: Scan first-party source and artifacts
        run: |
          set -euo pipefail
          ! rg -n -i '(/home/|/mnt/c/|[A-Z]:\\Users\\|api[_-]?key\s*[:=]|secret\s*[:=]|bearer\s+[A-Za-z0-9._~+/-]{12,})' \
            bench/fts5-wasm-obsidian-probe \
            --glob '!node_modules/**' --glob '!package-lock.json' --glob '!main.js'
          ! rg -n -i '(https?://(cdn\.|unpkg\.|cdn\.jsdelivr\.)|requestUrl|app\.vault|loadData\(|saveData\(|node:fs)' \
            bench/fts5-wasm-obsidian-probe/src
          test "$(find bench/fts5-wasm-obsidian-probe -maxdepth 1 -type f \
            \( -name '*.wasm' -o -name '*worker*.js' -o -name '*.map' -o -name '*.db' -o -name '*.sqlite' \) | wc -l)" -eq 0
      - name: Prepare short-retention field-test artifact
        if: matrix.node == '22.23.1'
        working-directory: bench/fts5-wasm-obsidian-probe
        run: |
          mkdir -p .tmp/sideload
          cp main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md .tmp/sideload/
          sha256sum .tmp/sideload/* > .tmp/sideload/SHA256SUMS
      - name: Upload sanitized evidence and sideload package
        if: matrix.node == '22.23.1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kwiry-fts5-gate2-field-test
          path: |
            bench/fts5-wasm-obsidian-probe/gate2.evidence.json
            bench/fts5-wasm-obsidian-probe/.tmp/sideload/
          retention-days: 7
          if-no-files-found: error
