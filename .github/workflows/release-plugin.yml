name: Validate Obsidian plugin release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plain semantic-version tag to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/obsidian
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/obsidian/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/obsidian/rust/kwiry-obsidian-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install
        run: npm ci
      - name: Verify production Rust adapter
        run: |
          cargo fmt --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml
          cargo check --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --target wasm32-unknown-unknown
          npm test --prefix rust/kwiry-obsidian-wasm
      - name: Verify plugin and deterministic evidence
        run: npm run verify
      - name: Verify tag identity and package versions
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=$CANDIDATE_TAG
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Candidate tag is not a plain semantic version.\n' >&2
            exit 1
          fi
          tag_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            printf 'Candidate tag does not match package versions.\n' >&2
            exit 1
          fi
      - name: Prepare exact candidate package
        run: |
          set -euo pipefail
          npm run --silent evidence > gate5.evidence.json
          npm run validate:evidence -- gate5.evidence.json
          npm run validate:privacy
          npm run package:release -- .tmp/release-candidate gate5.evidence.json
      - name: Upload candidate for separate publication authorization
        uses: actions/upload-artifact@v4
        with:
          name: kwiry-obsidian-candidate-${{ inputs.tag }}
          path: clients/obsidian/.tmp/release-candidate/
          retention-days: 14
          if-no-files-found: error
