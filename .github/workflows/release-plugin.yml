name: Validate Obsidian plugin release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plain semantic-version tag to validate
        required: true
        type: string
      ci_run_id:
        description: Exact successful CI workflow run ID for the tag commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: obsidian-release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: clients/obsidian
    steps:
      - name: Require trusted default-branch workflow revision
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          test "$GITHUB_REF" = "refs/heads/${default_branch}"
          trusted_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')
          test "$GITHUB_SHA" = "$trusted_sha"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind tag and selected CI run
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Candidate tag is not a plain semantic version.\n' >&2
            exit 1
          fi
          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Selected CI run ID is invalid.\n' >&2
            exit 1
          fi
          tag_commit=$(git rev-parse -q --verify "refs/tags/$CANDIDATE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
          manifest=$(node -p "require('./clients/obsidian/manifest.json').version")
          pkg=$(node -p "require('./clients/obsidian/package.json').version")
          test "$CANDIDATE_TAG" = "$manifest"
          test "$CANDIDATE_TAG" = "$pkg"
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")
          test "$(jq -r '.name' <<<"$run")" = "CI"
          test "$(jq -r '.event' <<<"$run")" = "workflow_dispatch"
          test "$(jq -r '.status' <<<"$run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run")" = "success"
          test "$(jq -r '.head_sha' <<<"$run")" = "$tag_commit"
          printf 'TAG_COMMIT=%s\n' "$tag_commit" >> "$GITHUB_ENV"
          printf 'CI_RUN_ATTEMPT=%s\n' "$(jq -r '.run_attempt' <<<"$run")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: clients/obsidian/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: clients/obsidian/rust/kwiry-obsidian-wasm
          shared-key: obsidian-wasm
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install
        run: npm ci
      - name: Verify production Rust adapter
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml
          cargo check --manifest-path rust/kwiry-obsidian-wasm/Cargo.toml --target wasm32-unknown-unknown
          npm test --prefix rust/kwiry-obsidian-wasm
      - name: Verify plugin and deterministic evidence
        run: npm run verify
      - name: Prepare exact candidate package
        run: |
          set -euo pipefail
          npm run --silent evidence > gate5.evidence.json
          npm run validate:evidence -- gate5.evidence.json
          npm run validate:privacy
          npm run package:release -- .tmp/release-candidate gate5.evidence.json
      - name: Install pinned X11 window manager
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes herbstluftwm=0.9.5-3
      - name: Run pinned real Obsidian WebDriver gate
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d "${GITHUB_WORKSPACE%/*}/.kw.XXXXXX")
          cleanup_stage() { rm -rf -- "$stage"; }
          trap cleanup_stage EXIT
          chmod 700 "$stage"
          mkdir "$stage/repository"
          cp -a "$GITHUB_WORKSPACE/." "$stage/repository"
          for gate_asset in webdriver-release-gate.mjs webdriver-release-gate-schema.mjs webdriver-release-gate-manifest.json; do
            git show "${GITHUB_SHA}:clients/obsidian/scripts/${gate_asset}" \
              > "$stage/repository/clients/obsidian/scripts/${gate_asset}"
          done
          node --input-type=module - \
            "$stage/repository/clients/obsidian/scripts/webdriver-release-gate.mjs" \
            "$stage/repository/clients/obsidian/scripts/webdriver-release-gate-manifest.json" \
            "$stage/runtime-assets" <<'NODE'
          import { mkdir, readFile } from "node:fs/promises";
          import { basename, resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const [scriptPath, manifestPath, outputRoot] = process.argv.slice(2);
          const { downloadPinnedArtifact } = await import(pathToFileURL(scriptPath));
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          await mkdir(outputRoot, { mode: 0o700 });
          for (const artifact of Object.values(manifest.artifacts)) {
            await downloadPinnedArtifact(artifact, resolve(outputRoot, basename(new URL(artifact.url).pathname)));
          }
          NODE
          python3 - "$stage/repository/clients/obsidian/scripts/webdriver-release-gate-manifest.json" "$stage/runtime-assets" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(output / pathlib.PurePosixPath(manifest["artifacts"]["chromedriver"]["url"]).name) as archive:
              members = [member for member in archive.infolist() if member.filename == "chromedriver"]
              if len(members) != 1 or members[0].is_dir() or members[0].file_size != manifest["derived"]["chromedriver_binary"]["bytes"]:
                  raise SystemExit("chromedriver archive identity mismatch")
              driver = archive.read(members[0])
          if hashlib.sha256(driver).hexdigest() != manifest["derived"]["chromedriver_binary"]["sha256"]:
              raise SystemExit("chromedriver binary identity mismatch")
          (output / "chromedriver").write_bytes(driver)
          PY
          cd "$stage/repository/clients/obsidian"
          KWIRY_WEBDRIVER_RUNTIME_ASSETS="$stage/runtime-assets" \
          KWIRY_WEBDRIVER_PRIVATE_ROOT="$stage/private" \
          KWIRY_WEBDRIVER_TMP_ROOT="$stage/t" \
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 +extension GLX -noreset' \
              bash -c '
                set -euo pipefail
                herbstluftwm >/dev/null 2>&1 &
                wm_pid=$!
                cleanup_wm() {
                  kill "$wm_pid" 2>/dev/null || true
                  wait "$wm_pid" 2>/dev/null || true
                }
                trap cleanup_wm EXIT
                sleep 1
                kill -0 "$wm_pid" 2>/dev/null
                npm run webdriver:release -- \
                  --candidate "$PWD/.tmp/release-candidate" \
                  --tag "$CANDIDATE_TAG" \
                  --manifest "$PWD/scripts/webdriver-release-gate-manifest.json" \
                  --evidence "$PWD/.tmp/webdriver.evidence.json"
              '
          npm run validate:webdriver:evidence -- .tmp/webdriver.evidence.json
          cp "$PWD/.tmp/webdriver.evidence.json" "$GITHUB_WORKSPACE/clients/obsidian/.tmp/webdriver.evidence.json"
          git show "${GITHUB_SHA}:clients/obsidian/scripts/webdriver-release-gate-schema.mjs" \
            > "$GITHUB_WORKSPACE/clients/obsidian/scripts/webdriver-release-gate-schema.mjs"
          git show "${GITHUB_SHA}:clients/obsidian/scripts/webdriver-release-gate-manifest.json" \
            > "$GITHUB_WORKSPACE/clients/obsidian/scripts/webdriver-release-gate-manifest.json"
          cd "$GITHUB_WORKSPACE/clients/obsidian"
      - name: Prepare release notes as data
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes_path="docs/releases/${CANDIDATE_TAG}.md"
          output=".tmp/release-notes.md"
          : > "$output"
          if git cat-file -e "${GITHUB_SHA}:${notes_path}"; then
            git show "${GITHUB_SHA}:${notes_path}" > "$output"
            printf '\n---\n\n' >> "$output"
          else
            printf 'No release notes were written for %s.\n\n' "$CANDIDATE_TAG" >> "$output"
          fi
          {
            echo "Kwiry Search Obsidian plugin ${CANDIDATE_TAG} (GPL-3.0-only)."
            echo
            echo "Install via BRAT with repository \`${GITHUB_REPOSITORY}\`, or use \`kwiry-search.zip\` for a manual installation with licence and third-party notices."
            echo
            echo "Corresponding source: https://github.com/${GITHUB_REPOSITORY}/tree/${CANDIDATE_TAG}/clients/obsidian"
            echo "The narrow real-host WebDriver gate and automated Gate 5 evidence do not constitute owner field acceptance or a final supported-profile declaration."
          } >> "$output"
      - name: Construct immutable tested-candidate handoff
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          npm run prepare:release:handoff -- \
            "$PWD/.tmp/release-candidate" \
            "$PWD/.tmp/webdriver.evidence.json" \
            "$PWD/.tmp/release-notes.md" \
            "$PWD/.tmp/release-handoff" \
            "$CANDIDATE_TAG" \
            "$TAG_COMMIT" \
            "$CI_RUN_ID" \
            "$CI_RUN_ATTEMPT" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT"
          npm run validate:release:handoff -- .tmp/release-handoff
      - name: Upload exact validated candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kwiry-obsidian-validated-candidate-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/obsidian/.tmp/release-handoff/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
