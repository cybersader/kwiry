name: Publish validated Obsidian plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated plain semantic-version tag to publish
        required: true
        type: string
      candidate_run_id:
        description: Exact successful release-candidate workflow run ID
        required: true
        type: string
      candidate_artifact_id:
        description: Exact validated-candidate artifact ID from that run
        required: true
        type: string
      candidate_artifact_digest:
        description: Exact sha256 artifact digest reported by GitHub Actions
        required: true
        type: string

permissions: {}

concurrency:
  group: obsidian-release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag_commit: ${{ steps.bind.outputs.tag_commit }}
      artifact_name: ${{ steps.bind.outputs.artifact_name }}
    steps:
      - name: Require trusted default-branch workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          test "$GITHUB_REF" = "refs/heads/${default_branch}"
          trusted_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')
          test "$GITHUB_SHA" = "$trusted_sha"
      - id: bind
        name: Bind tag, candidate run, and exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Publication tag is not a plain semantic version.\n' >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Candidate run or artifact ID is invalid.\n' >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Candidate artifact digest is invalid.\n' >&2
            exit 1
          fi
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          object_sha=$(jq -r '.object.sha' <<<"$tag")
          object_type=$(jq -r '.object.type' <<<"$tag")
          if [ "$object_type" = "tag" ]; then
            tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')
          elif [ "$object_type" = "commit" ]; then
            tag_commit=$object_sha
          else
            printf 'Tag object type is unsupported.\n' >&2
            exit 1
          fi
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          trusted_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-plugin.yml")
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")
          test "$(jq -r '.workflow_id' <<<"$run")" = "$(jq -r '.id' <<<"$workflow")"
          test "$(jq -r '.path' <<<"$workflow")" = ".github/workflows/release-plugin.yml"
          test "$(jq -r '.state' <<<"$workflow")" = "active"
          test "$(jq -r '.event' <<<"$run")" = "workflow_dispatch"
          test "$(jq -r '.status' <<<"$run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run")" = "success"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head_branch' <<<"$run")" = "$default_branch"
          test "$(jq -r '.head_sha' <<<"$run")" = "$trusted_sha"
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}")
          test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$CANDIDATE_RUN_ID"
          test "$(jq -r '.expired' <<<"$artifact")" = "false"
          test "$(jq -r '.digest' <<<"$artifact")" = "$CANDIDATE_ARTIFACT_DIGEST"
          artifact_name=$(jq -r '.name' <<<"$artifact")
          expected_name="kwiry-obsidian-validated-candidate-${RELEASE_TAG}-${CANDIDATE_RUN_ID}-$(jq -r '.run_attempt' <<<"$run")"
          test "$artifact_name" = "$expected_name"
          printf 'tag_commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

  publish:
    needs: authorize
    environment: obsidian-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Re-resolve protected release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_COMMIT: ${{ needs.authorize.outputs.tag_commit }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          object_sha=$(jq -r '.object.sha' <<<"$tag")
          object_type=$(jq -r '.object.type' <<<"$tag")
          if [ "$object_type" = "tag" ]; then
            current_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')
          elif [ "$object_type" = "commit" ]; then
            current_commit=$object_sha
          else
            exit 1
          fi
          test "$current_commit" = "$AUTHORIZED_TAG_COMMIT"
      - name: Download exact candidate artifact by ID
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -m 700 handoff
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > candidate.zip
          printf '%s  candidate.zip\n' "${CANDIDATE_ARTIFACT_DIGEST#sha256:}" | sha256sum --check --strict
          python3 - <<'PY'
          import os
          import stat
          import zipfile

          source = "candidate.zip"
          destination = "handoff"
          with zipfile.ZipFile(source) as archive:
              seen = set()
              for info in archive.infolist():
                  name = info.filename
                  if not name or name in seen or name.startswith("/") or "\\" in name:
                      raise SystemExit("candidate artifact layout invalid")
                  parts = name.split("/")
                  if any(part in ("", ".", "..") for part in parts):
                      raise SystemExit("candidate artifact layout invalid")
                  mode = info.external_attr >> 16
                  if mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise SystemExit("candidate artifact contains a special file")
                  seen.add(name)
              archive.extractall(destination)
          PY
      - name: Validate closed handoff without executing artifact code
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ needs.authorize.outputs.tag_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("handoff")
          manifest_path = root / "release-handoff.json"
          manifest = json.loads(manifest_path.read_bytes())
          required_root = {"release-assets", "webdriver.evidence.json", "release-notes.md", "release-handoff.json", "release-handoff.sha256"}
          if {path.name for path in root.iterdir()} != required_root:
              raise SystemExit("candidate handoff root set invalid")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("candidate handoff contains a symbolic link")
          if manifest.get("schema_version") != 1 or manifest.get("kind") != "kwiry_obsidian_validated_candidate_handoff":
              raise SystemExit("candidate handoff schema invalid")
          if manifest.get("tag") != os.environ["RELEASE_TAG"] or manifest.get("tag_commit") != os.environ["TAG_COMMIT"]:
              raise SystemExit("candidate tag binding invalid")
          auth = manifest.get("authorization", {})
          if str(auth.get("candidate_run_id")) != os.environ["CANDIDATE_RUN_ID"]:
              raise SystemExit("candidate run binding invalid")
          candidate = manifest.get("candidate", {})
          files = candidate.get("files")
          if not isinstance(files, list) or candidate.get("file_count") != len(files):
              raise SystemExit("candidate file manifest invalid")
          expected_assets = []
          domain = hashlib.sha256(b"kwiry-production-candidate-set-v1\0")
          for identity in files:
              name = identity.get("name")
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name):
                  raise SystemExit("candidate asset name invalid")
              path = root / "release-assets" / name
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != identity.get("bytes") or digest != identity.get("sha256"):
                  raise SystemExit("candidate asset identity invalid")
              expected_assets.append(name)
              domain.update(name.encode()); domain.update(b"\0")
              domain.update(str(len(data)).encode()); domain.update(b"\0")
              domain.update(digest.encode()); domain.update(b"\0")
          actual_assets = sorted(path.name for path in (root / "release-assets").iterdir() if path.is_file())
          if actual_assets != sorted(expected_assets) or any(not path.is_file() for path in (root / "release-assets").iterdir()):
              raise SystemExit("candidate asset set invalid")
          if domain.hexdigest() != candidate.get("candidate_set_sha256"):
              raise SystemExit("candidate set identity invalid")
          checksums = []
          for path in sorted([*(f"release-assets/{name}" for name in expected_assets), "webdriver.evidence.json", "release-handoff.json", "release-notes.md"]):
              data = (root / path).read_bytes()
              checksums.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          if (root / "release-handoff.sha256").read_text() != "\n".join(checksums) + "\n":
              raise SystemExit("candidate handoff checksums invalid")
          evidence = (root / "webdriver.evidence.json").read_bytes()
          notes = (root / "release-notes.md").read_bytes()
          if hashlib.sha256(evidence).hexdigest() != manifest["webdriver_evidence"]["sha256"]:
              raise SystemExit("WebDriver evidence identity invalid")
          if manifest["webdriver_evidence"].get("verdict") != "SELENIUM_RELEASE_GATE_PASSED":
              raise SystemExit("WebDriver verdict invalid")
          if hashlib.sha256(notes).hexdigest() != manifest["release_notes"]["sha256"] or len(notes) != manifest["release_notes"]["bytes"]:
              raise SystemExit("release notes identity invalid")
          pathlib.Path("publish-assets.txt").write_text("\n".join(str(root / "release-assets" / name) for name in expected_assets) + "\n")
          PY
      - name: Create draft release from exact tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < publish-assets.txt
          prerelease=()
          case "$RELEASE_TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "kwiry-search $RELEASE_TAG" \
            --notes-file handoff/release-notes.md \
            "${prerelease[@]}" \
            "${assets[@]}"
      - name: Verify uploaded release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          AUTHORIZED_TAG_COMMIT: ${{ needs.authorize.outputs.tag_commit }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          object_sha=$(jq -r '.object.sha' <<<"$tag")
          object_type=$(jq -r '.object.type' <<<"$tag")
          if [ "$object_type" = "tag" ]; then
            current_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')
          elif [ "$object_type" = "commit" ]; then
            current_commit=$object_sha
          else
            exit 1
          fi
          test "$current_commit" = "$AUTHORIZED_TAG_COMMIT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path("handoff/release-handoff.json").read_bytes())
          for identity in manifest["candidate"]["files"]:
              output = pathlib.Path("release-downloads") / identity["name"]
              output.parent.mkdir(exist_ok=True)
              subprocess.run([
                  "gh", "release", "download", os.environ["RELEASE_TAG"],
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--pattern", identity["name"], "--output", str(output),
              ], check=True)
              data = output.read_bytes()
              if len(data) != identity["bytes"] or hashlib.sha256(data).hexdigest() != identity["sha256"]:
                  raise SystemExit("uploaded release asset identity invalid")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
