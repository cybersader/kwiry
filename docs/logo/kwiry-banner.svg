<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-labelledby="title desc">
  <title id="title">kwiry</title>
  <desc id="desc">A pixel magnifying-glass badge beside a rounded pixel wordmark.</desc>

  <!-- Badge -->
  <g aria-hidden="true">
    <rect x="8" y="12" width="96" height="96" rx="22" fill="#22D3EE"/>
    <rect x="11" y="15" width="90" height="90" rx="19" fill="#0F172A"/>
    <rect x="82" y="25" width="10" height="10" rx="3" fill="#22D3EE" opacity="0.9"/>

    <!-- Pixel magnifying glass -->
    <rect x="27" y="34" width="40" height="10" rx="3" fill="#22D3EE"/>
    <rect x="19" y="42" width="10" height="28" rx="3" fill="#22D3EE"/>
    <rect x="65" y="42" width="10" height="28" rx="3" fill="#22D3EE"/>
    <rect x="27" y="68" width="40" height="10" rx="3" fill="#22D3EE"/>
    <rect x="67" y="70" width="12" height="12" rx="3" fill="#22D3EE"/>
    <rect x="77" y="80" width="12" height="12" rx="3" fill="#22D3EE"/>
  </g>

  <defs>
    <!-- Dark wordmark pixels; rendered below with a cyan outer echo. -->
    <g id="kwiry-ink">
      <!-- k -->
      <rect x="130" y="24" width="14" height="14" rx="4"/>
      <rect x="130" y="42" width="14" height="14" rx="4"/>
      <rect x="130" y="60" width="14" height="14" rx="4"/>
      <rect x="130" y="78" width="14" height="14" rx="4"/>
      <rect x="130" y="96" width="14" height="14" rx="4"/>
      <rect x="184" y="24" width="14" height="14" rx="4"/>
      <rect x="166" y="42" width="14" height="14" rx="4"/>
      <rect x="148" y="60" width="14" height="14" rx="4"/>
      <rect x="166" y="78" width="14" height="14" rx="4"/>
      <rect x="184" y="96" width="14" height="14" rx="4"/>

      <!-- w -->
      <rect x="212" y="42" width="14" height="14" rx="4"/>
      <rect x="284" y="42" width="14" height="14" rx="4"/>
      <rect x="212" y="60" width="14" height="14" rx="4"/>
      <rect x="248" y="60" width="14" height="14" rx="4"/>
      <rect x="284" y="60" width="14" height="14" rx="4"/>
      <rect x="212" y="78" width="14" height="14" rx="4"/>
      <rect x="248" y="78" width="14" height="14" rx="4"/>
      <rect x="284" y="78" width="14" height="14" rx="4"/>
      <rect x="230" y="96" width="14" height="14" rx="4"/>
      <rect x="266" y="96" width="14" height="14" rx="4"/>

      <!-- i stem -->
      <rect x="316" y="42" width="14" height="14" rx="4"/>
      <rect x="316" y="60" width="14" height="14" rx="4"/>
      <rect x="316" y="78" width="14" height="14" rx="4"/>
      <rect x="316" y="96" width="14" height="14" rx="4"/>

      <!-- r -->
      <rect x="350" y="42" width="14" height="14" rx="4"/>
      <rect x="368" y="42" width="14" height="14" rx="4"/>
      <rect x="386" y="42" width="14" height="14" rx="4"/>
      <rect x="350" y="60" width="14" height="14" rx="4"/>
      <rect x="404" y="60" width="14" height="14" rx="4"/>
      <rect x="350" y="78" width="14" height="14" rx="4"/>
      <rect x="350" y="96" width="14" height="14" rx="4"/>

      <!-- y -->
      <rect x="434" y="42" width="14" height="14" rx="4"/>
      <rect x="488" y="42" width="14" height="14" rx="4"/>
      <rect x="434" y="60" width="14" height="14" rx="4"/>
      <rect x="488" y="60" width="14" height="14" rx="4"/>
      <rect x="452" y="78" width="14" height="14" rx="4"/>
      <rect x="470" y="78" width="14" height="14" rx="4"/>
      <rect x="488" y="78" width="14" height="14" rx="4"/>
      <rect x="488" y="96" width="14" height="14" rx="4"/>
    </g>
  </defs>

  <!-- Cyan echo preserves contrast on dark GitHub themes. -->
  <use href="#kwiry-ink" fill="#22D3EE" stroke="#22D3EE" stroke-width="3" stroke-linejoin="round" opacity="0.58" aria-hidden="true"/>
  <use href="#kwiry-ink" fill="#0F172A" aria-hidden="true"/>

  <!-- Cyan wordmark accents -->
  <rect x="316" y="24" width="14" height="14" rx="4" fill="#22D3EE" aria-hidden="true"/>
  <rect x="470" y="102" width="14" height="14" rx="4" fill="#22D3EE" aria-hidden="true"/>
</svg>
