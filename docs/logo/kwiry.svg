<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="kwiry logo">
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#22D3EE"/>
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#0F172A"/>
  <g fill="#22D3EE">
    <!-- Symmetric stepped-pixel lens ring, centered at 13,13 -->
    <rect x="9" y="5" width="8" height="3" rx="1"/>
    <rect x="7" y="7" width="4" height="4" rx="1"/>
    <rect x="15" y="7" width="4" height="4" rx="1"/>
    <rect x="5" y="9" width="3" height="8" rx="1"/>
    <rect x="18" y="9" width="3" height="8" rx="1"/>
    <rect x="7" y="15" width="4" height="4" rx="1"/>
    <rect x="15" y="15" width="4" height="4" rx="1"/>
    <rect x="9" y="18" width="8" height="3" rx="1"/>

    <!-- Overlapping 45-degree handle blocks -->
    <rect x="17" y="17" width="5" height="5" rx="1"/>
    <rect x="20" y="20" width="5" height="5" rx="1"/>
    <rect x="23" y="23" width="5" height="5" rx="1"/>
  </g>
</svg>
