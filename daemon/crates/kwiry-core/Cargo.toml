[package]
name = "kwiry-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arc-swap = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlite-vec = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
tantivy = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
rawzip = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[[example]]
name = "d5c_balanced_playground"
path = "examples/d5c_balanced_playground.rs"
required-features = ["internal-d5c-preview", "native"]

[features]
default = ["native"]
portable = [
  "dep:flate2",
  "dep:pulldown-cmark",
  "dep:quick-xml",
  "dep:rawzip",
  "dep:regex",
  "dep:serde",
  "dep:serde-saphyr",
  "dep:serde_json",
  "dep:sha2",
  "dep:thiserror",
  "dep:unicode-normalization",
]
native = [
  "portable",
  "dep:arc-swap",
  "dep:base64",
  "dep:directories",
  "dep:fs2",
  "dep:getrandom",
  "dep:ignore",
  "dep:libc",
  "dep:rusqlite",
  "dep:sqlite-vec",
  "dep:subtle",
  "dep:tantivy",
  "dep:tempfile",
  "dep:time",
  "dep:toml",
  "dep:windows-sys",
  "dep:zerocopy",
]
# Enables the fastembed/ONNX embedder. Native sqlite-vec state and RRF remain
# covered without ONNX so tests do not need to load the model.
semantic-onnx = ["native", "dep:fastembed"]
# Exposes the test-only D5C profile contract to explicit preview adapters.
internal-d5c-preview = ["portable"]
# Retained so existing callers keep resolving; DOCX extraction is now part of
# the portable format set rather than an opt-in spike.
internal-docx-extractor = ["portable"]
# Retained so existing callers keep resolving; Excalidraw extraction is now part
# of the portable format set following the 2026-08-06 contract amendment.
internal-excalidraw-extractor = ["portable"]

[dev-dependencies]
filetime.workspace = true
