[package]
name = "kwiry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["semantic-onnx"]
semantic-onnx = ["kwiry-core/semantic-onnx"]
# Test-only: builds the reader stall point into a debug binary (see
# kwiry-core `internal-stall-hook-test`). Release builds never contain it.
internal-stall-hook-test = ["kwiry-core/internal-stall-hook-test"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
fs2.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
kwiry-core = { path = "../kwiry-core" }
kwiry-holdings = { path = "../kwiry-holdings" }
notify.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Lifecycle holder transport (blocking HTTP, rustls with web PKI roots). Already
# in the dependency graph through the semantic model downloader.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
# Synthetic physical-row corruption fixture; never part of the daemon adapter.
tantivy.workspace = true
assert_cmd.workspace = true
http-body-util.workspace = true
jsonschema = { version = "0.33", default-features = false }
kwiry-core = { path = "../kwiry-core", features = ["internal-storage-probe-test", "internal-stall-hook-test"] }
kwiry-holdings = { path = "../kwiry-holdings", features = ["testkit"] }
predicates.workspace = true
tower.workspace = true
