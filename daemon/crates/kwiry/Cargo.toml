[package]
name = "kwiry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["semantic-onnx"]
semantic-onnx = ["kwiry-core/semantic-onnx"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
kwiry-core = { path = "../kwiry-core" }
kwiry-holdings = { path = "../kwiry-holdings" }
notify.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Lifecycle holder transport (blocking HTTP, rustls with web PKI roots). Already
# in the dependency graph through the semantic model downloader.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
assert_cmd.workspace = true
http-body-util.workspace = true
kwiry-holdings = { path = "../kwiry-holdings", features = ["testkit"] }
predicates.workspace = true
tower.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
