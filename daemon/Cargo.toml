[workspace]
members = ["crates/kwiry-core", "crates/kwiry"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
assert_cmd = "2.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
getrandom = "0.3"
http-body-util = "0.1"
ignore = "0.4"
libc = "0.2"
notify = "8.2"
predicates = "3.1"
pulldown-cmark = "0.13"
regex = "1.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0"
sha2 = "0.10"
sqlite-vec = "0.1.9"
subtle = "2.6"
tantivy = "0.26.1"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
unicode-normalization = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
zerocopy = "0.8"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
filetime = "0.2"
